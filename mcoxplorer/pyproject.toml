[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcoxplorer"
version = "0.1.0"
description = "Multimodal candidate prioritization for remote Mn(II)-oxidizing MCO discovery"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "MnOx Lab"}]
dependencies = [
  "pyyaml>=6.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "biopython>=1.83",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
esm = [
  "torch>=2.1",
  "transformers>=4.38",
]

[project.scripts]
mcoxplorer = "mcoxplorer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
